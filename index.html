<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #0a0a0a;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    color: #e6d9a8;
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2vmin;
  }

  /* ===== Ссылка-обёртка на весь баннер ===== */
  .banner-link {
    display: block;
    width: 100%;
    max-width: 3200px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    border-radius: clamp(16px, 1.5vmin, 32px);
  }

  .banner {
    position: relative;
    width: 100%;
    min-height: 80vh;
    padding: clamp(30px, 4vmin, 100px) clamp(40px, 5vmin, 120px);
    border: 2px solid rgba(255, 200, 0, 0.35);
    border-radius: clamp(16px, 1.5vmin, 32px);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,200,0,0.08), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(255,140,0,0.08), transparent 60%),
      linear-gradient(160deg, #121212 0%, #1a1a1a 50%, #0e0e0e 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(20px, 3vmin, 60px);
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  .banner-link:hover .banner {
    border-color: rgba(255, 200, 0, 0.7);
    box-shadow: 0 0 60px rgba(255, 200, 0, 0.35);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 {
    width: clamp(300px, 30vmin, 700px);
    height: clamp(300px, 30vmin, 700px);
    background: rgba(255, 200, 0, 0.18);
    top: -10%; left: -5%;
  }
  .glow-2 {
    width: clamp(350px, 35vmin, 800px);
    height: clamp(350px, 35vmin, 800px);
    background: rgba(255, 140, 0, 0.15);
    bottom: -15%; right: -5%;
  }

  .header {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: clamp(8px, 1vmin, 20px);
    flex-wrap: wrap;
  }

  .badge {
    padding: clamp(6px, 0.8vmin, 14px) clamp(14px, 1.6vmin, 32px);
    font-size: clamp(13px, 1.1vmin, 24px);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffc800;
    border: 1px solid rgba(255, 200, 0, 0.5);
    border-radius: 999px;
    background: rgba(255, 200, 0, 0.06);
    backdrop-filter: blur(10px);
    transition: 0.3s;
  }
  .badge:hover {
    background: rgba(255, 200, 0, 0.15);
    box-shadow: 0 0 25px rgba(255, 200, 0, 0.35);
  }
  .badge.vip {
    color: #1a1206;
    background: linear-gradient(135deg, #fff9a8, #ffd000, #ffa000);
    border-color: #ffd000;
    box-shadow: 0 0 25px rgba(255, 200, 0, 0.6);
  }
  .badge.vip:hover { box-shadow: 0 0 45px rgba(255, 200, 0, 0.95); }

  .logo-section {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(8px, 1.2vmin, 24px);
    flex: 1;
    justify-content: center;
  }

  .logo-svg {
    width: clamp(120px, 14vmin, 320px);
    height: auto;
    filter: drop-shadow(0 0 30px rgba(255, 200, 0, 0.45));
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(255, 200, 0, 0.45)); }
    50%      { filter: drop-shadow(0 0 55px rgba(255, 200, 0, 0.75)); }
  }

  .brand-name {
    font-size: clamp(38px, 7vmin, 160px);
    font-weight: 900;
    letter-spacing: clamp(3px, 0.6vmin, 12px);
    background: linear-gradient(180deg, #fff9a8 0%, #ffe000 45%, #f0a500 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 60px rgba(255, 200, 0, 0.35);
    line-height: 1;
  }

  .brand-slogan {
    font-size: clamp(14px, 1.6vmin, 34px);
    letter-spacing: clamp(2px, 0.4vmin, 8px);
    color: #c9b884;
    text-transform: uppercase;
  }

  /* ===== "Кнопка" Завербовать (span внутри ссылки-баннера) ===== */
  .recruit-btn {
    position: relative;
    z-index: 3;
    display: inline-block;
    align-self: center;
    margin-top: clamp(10px, 1.5vmin, 30px);
    padding: clamp(12px, 1.6vmin, 28px) clamp(36px, 4.5vmin, 90px);
    font-size: clamp(16px, 1.8vmin, 38px);
    font-weight: 900;
    letter-spacing: clamp(2px, 0.3vmin, 6px);
    text-transform: uppercase;
    text-decoration: none;
    color: #1a1206;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #fff9a8 0%, #ffd000 40%, #ffa000 100%);
    box-shadow:
      0 0 40px rgba(255, 200, 0, 0.55),
      inset 0 0 20px rgba(255, 255, 255, 0.4);
    transition: 0.25s;
    overflow: hidden;
  }
  .recruit-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transition: 0.6s;
  }
  .recruit-btn:hover {
    transform: translateY(-3px) scale(1.03);
    color: #1a1206;
    box-shadow:
      0 0 70px rgba(255, 200, 0, 0.9),
      inset 0 0 30px rgba(255, 255, 255, 0.6);
  }
  .recruit-btn:hover::before { left: 100%; }
  .recruit-btn:active { transform: scale(0.98); }

  /* ===== Арена со спартанцами ===== */
  .arena {
    position: relative;
    z-index: 2;
    width: 100%;
    height: clamp(90px, 14vmin, 220px);
    margin-top: clamp(10px, 1.5vmin, 30px);
    overflow: hidden;
    border-top: 1px solid rgba(255, 200, 0, 0.2);
    border-bottom: 1px solid rgba(255, 200, 0, 0.2);
    background: linear-gradient(180deg, rgba(255,200,0,0.03) 0%, rgba(0,0,0,0.4) 100%);
  }
  .arena::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,200,0,0.5), transparent);
  }

  .pcs {
    position: absolute;
    right: clamp(10px, 2vmin, 40px);
    bottom: 12%;
    display: flex;
    gap: clamp(6px, 1vmin, 18px);
    z-index: 3;
  }

  .pc {
    width: clamp(28px, 4vmin, 70px);
    height: clamp(22px, 3.2vmin, 56px);
    border: 2px solid #ffc800;
    border-radius: 4px;
    background: rgba(255, 200, 0, 0.08);
    box-shadow:
      0 0 14px rgba(255, 200, 0, 0.6),
      inset 0 0 10px rgba(255, 200, 0, 0.25);
    position: relative;
    animation: pcBlink 2s ease-in-out infinite;
  }
  .pc::before {
    content: "";
    position: absolute;
    left: 20%; top: 20%;
    width: 60%; height: 40%;
    background: rgba(255, 200, 0, 0.35);
    border-radius: 2px;
  }
  .pc::after {
    content: "";
    position: absolute;
    left: 40%; bottom: -6px;
    width: 20%; height: 6px;
    background: #ffc800;
    border-radius: 0 0 3px 3px;
  }
  .pc:nth-child(2) { animation-delay: 0.3s; }
  .pc:nth-child(3) { animation-delay: 0.6s; }
  .pc:nth-child(4) { animation-delay: 0.9s; }

  @keyframes pcBlink {
    0%, 100% { box-shadow: 0 0 14px rgba(255,200,0,0.6), inset 0 0 10px rgba(255,200,0,0.25); }
    50%      { box-shadow: 0 0 30px rgba(255,200,0,0.95), inset 0 0 18px rgba(255,200,0,0.5); }
  }

  .spartan {
    position: absolute;
    bottom: 12%;
    left: -12%;
    width: clamp(38px, 5.5vmin, 100px);
    height: auto;
    animation: runAndJump 6s linear infinite;
    filter: drop-shadow(0 0 12px rgba(255, 200, 0, 0.65));
    z-index: 2;
  }
  .spartan:nth-child(2) { animation-delay: -2s; bottom: 14%; }
  .spartan:nth-child(3) { animation-delay: -4s; bottom: 10%; }
  .spartan:nth-child(4) { animation-delay: -1s; bottom: 13%; }

  @keyframes runAndJump {
    0%   { transform: translateX(0) translateY(0) scaleX(1); opacity: 0; }
    5%   { opacity: 1; }
    70%  { transform: translateX(calc(60vw)) translateY(0) scaleX(1); opacity: 1; }
    80%  { transform: translateX(calc(68vw)) translateY(-40%) scaleX(1); opacity: 1; }
    88%  { transform: translateX(calc(74vw)) translateY(-70%) scaleX(0.3); opacity: 0.4; }
    100% { transform: translateX(calc(80vw)) translateY(-100%) scaleX(0); opacity: 0; }
  }

  .spartan::after {
    content: "";
    position: absolute;
    inset: -25%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,80,0.95), transparent 70%);
    opacity: 0;
    animation: flash 6s linear infinite;
    pointer-events: none;
  }
  .spartan:nth-child(2)::after { animation-delay: -2s; }
  .spartan:nth-child(3)::after { animation-delay: -4s; }
  .spartan:nth-child(4)::after { animation-delay: -1s; }

  @keyframes flash {
    0%, 78% { opacity: 0; }
    84%     { opacity: 1; }
    92%     { opacity: 0; }
    100%    { opacity: 0; }
  }

  .info {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 2vmin, 40px);
    margin-top: clamp(4px, 1vmin, 20px);
  }

  .card {
    text-align: center;
    padding: clamp(16px, 2.5vmin, 48px) clamp(12px, 1.5vmin, 30px);
    border: 1px solid rgba(255, 200, 0, 0.3);
    border-radius: clamp(12px, 1.2vmin, 24px);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    transition: 0.3s;
    cursor: pointer;
  }
  .card:hover {
    border-color: #ffc800;
    box-shadow: 0 0 35px rgba(255, 200, 0, 0.5);
    transform: translateY(-5px);
  }
  .card .num {
    font-size: clamp(22px, 2.8vmin, 64px);
    font-weight: 900;
    color: #ffc800;
    text-shadow: 0 0 22px rgba(255, 200, 0, 0.7);
    white-space: nowrap;

  .card .label {
    font-size: clamp(12px, 1.1vmin, 24px);
    margin-top: clamp(4px, 0.6vmin, 12px);
    color: #c9b884;
    letter-spacing: 1px;
  }

  .footer {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(8px, 1.5vmin, 30px);
    border-top: 1px solid rgba(255, 200, 0, 0.3);
    padding-top: clamp(14px, 2vmin, 40px);
    font-size: clamp(14px, 1.4vmin, 30px);
    color: #e6d9a8;
  }
  .footer .contact span { color: #ffc800; font-weight: 700; }
  .footer .tg {
    font-size: clamp(16px, 1.6vmin, 34px);
    font-weight: 700;
    background: linear-gradient(90deg, #ffc800, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @media (max-width: 700px) {
    .info { grid-template-columns: 1fr; }
    .footer { flex-direction: column; text-align: center; }
    .pcs { display: none; }
    .header { justify-content: center; }
  }
</style>
